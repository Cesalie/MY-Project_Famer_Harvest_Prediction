<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Main teal gradient -->
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a6b62"/>
      <stop offset="100%" stop-color="#0f3d38"/>
    </radialGradient>
    <!-- Gold shimmer -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Teal accent -->
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <!-- White glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <!-- Outer ring shadow -->
  <circle cx="100" cy="102" r="96" fill="rgba(0,0,0,0.18)"/>

  <!-- Main circle background -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)"/>

  <!-- Inner subtle ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Top arc highlight -->
  <path d="M 30,80 A 75,75 0 0,1 170,80" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="18" stroke-linecap="round"/>

  <!-- ── Wheat stalks (teal accent) ── -->
  <g filter="url(#glow)">
    <!-- Left stalk -->
    <line x1="68" y1="138" x2="68" y2="92" stroke="url(#tealAccent)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="68" y1="92"  x2="61" y2="80" stroke="url(#tealAccent)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="68" y1="97"  x2="60" y2="88" stroke="url(#tealAccent)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="68" y1="103" x2="59" y2="95" stroke="url(#tealAccent)" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="68" y1="92"  x2="75" y2="80" stroke="url(#tealAccent)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="68" y1="97"  x2="76" y2="88" stroke="url(#tealAccent)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="68" y1="103" x2="77" y2="95" stroke="url(#tealAccent)" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Grain tip left -->
    <ellipse cx="68" cy="78" rx="4" ry="6" fill="#5eead4" opacity="0.9" transform="rotate(-5,68,78)"/>

    <!-- Center stalk (tallest) -->
    <line x1="100" y1="140" x2="100" y2="78" stroke="url(#tealAccent)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="100" y1="78"  x2="91"  y2="63" stroke="url(#tealAccent)" stroke-width="2"   stroke-linecap="round"/>
    <line x1="100" y1="85"  x2="89"  y2="74" stroke="url(#tealAccent)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="100" y1="92"  x2="88"  y2="83" stroke="url(#tealAccent)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="100" y1="78"  x2="109" y2="63" stroke="url(#tealAccent)" stroke-width="2"   stroke-linecap="round"/>
    <line x1="100" y1="85"  x2="111" y2="74" stroke="url(#tealAccent)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="100" y1="92"  x2="112" y2="83" stroke="url(#tealAccent)" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Grain tip center -->
    <ellipse cx="100" cy="61" rx="5" ry="7.5" fill="#2dd4bf" opacity="0.95"/>

    <!-- Right stalk -->
    <line x1="132" y1="138" x2="132" y2="92" stroke="url(#tealAccent)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="132" y1="92"  x2="125" y2="80" stroke="url(#tealAccent)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="132" y1="97"  x2="124" y2="88" stroke="url(#tealAccent)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="132" y1="103" x2="123" y2="95" stroke="url(#tealAccent)" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="132" y1="92"  x2="139" y2="80" stroke="url(#tealAccent)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="132" y1="97"  x2="140" y2="88" stroke="url(#tealAccent)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="132" y1="103" x2="141" y2="95" stroke="url(#tealAccent)" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Grain tip right -->
    <ellipse cx="132" cy="78" rx="4" ry="6" fill="#5eead4" opacity="0.9" transform="rotate(5,132,78)"/>
  </g>

  <!-- ── Bar chart (white, semi-transparent) ── -->
  <g opacity="0.88">
    <rect x="52" y="122" width="9"  height="18" rx="2.5" fill="rgba(255,255,255,0.5)"/>
    <rect x="64" y="114" width="9"  height="26" rx="2.5" fill="rgba(255,255,255,0.65)"/>
    <rect x="76" y="107" width="9"  height="33" rx="2.5" fill="rgba(255,255,255,0.8)"/>
    <rect x="88" y="100" width="9"  height="40" rx="2.5" fill="rgba(255,255,255,0.95)"/>
  </g>

  <!-- ── Trend arrow (gold) ── -->
  <g filter="url(#glow)">
    <polyline points="52,130 64,120 76,111 88,103 104,95 120,87"
      fill="none" stroke="url(#goldGrad)" stroke-width="3.2"
      stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrow head -->
    <polygon points="120,87 112,92 116,98" fill="url(#goldGrad)"/>
    <!-- Dots on line -->
    <circle cx="52"  cy="130" r="2.5" fill="#fbbf24"/>
    <circle cx="76"  cy="111" r="2.5" fill="#fbbf24"/>
    <circle cx="104" cy="95"  r="2.5" fill="#fbbf24"/>
  </g>

  <!-- ── Ground line ── -->
  <line x1="44" y1="142" x2="156" y2="142" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>

  <!-- ── Bottom text band ── -->
  <rect x="4" y="152" width="192" height="40" rx="0" fill="rgba(0,0,0,0.22)"/>
  <rect x="4" y="188" width="192" height="8"  rx="0" fill="rgba(0,0,0,0.1)"/>

  <!-- BUGESERA -->
  <text x="100" y="167" text-anchor="middle"
    font-family="'Arial Black',Arial,sans-serif"
    font-size="14.5" font-weight="900" fill="white" letter-spacing="2.5">BUGESERA</text>

  <!-- HARVEST PREDICTION -->
  <text x="100" y="180" text-anchor="middle"
    font-family="Arial,sans-serif"
    font-size="7" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="1.8">HARVEST PREDICTION</text>
</svg>
