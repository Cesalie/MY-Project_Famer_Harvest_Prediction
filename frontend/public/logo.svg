<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Circular background -->
  <circle cx="100" cy="100" r="98" fill="#14532d" stroke="white" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Wheat/grain stalks -->
  <g stroke="#86efac" stroke-width="2.5" stroke-linecap="round">
    <!-- Left stalk -->
    <line x1="72" y1="140" x2="72" y2="90"/>
    <line x1="72" y1="90" x2="65" y2="78"/>
    <line x1="72" y1="95" x2="63" y2="86"/>
    <line x1="72" y1="100" x2="62" y2="93"/>
    <line x1="72" y1="90" x2="79" y2="78"/>
    <line x1="72" y1="95" x2="81" y2="86"/>
    <line x1="72" y1="100" x2="82" y2="93"/>
    <!-- Center stalk -->
    <line x1="100" y1="145" x2="100" y2="82"/>
    <line x1="100" y1="82" x2="92" y2="68"/>
    <line x1="100" y1="88" x2="90" y2="78"/>
    <line x1="100" y1="95" x2="89" y2="87"/>
    <line x1="100" y1="82" x2="108" y2="68"/>
    <line x1="100" y1="88" x2="110" y2="78"/>
    <line x1="100" y1="95" x2="111" y2="87"/>
    <!-- Right stalk -->
    <line x1="128" y1="140" x2="128" y2="90"/>
    <line x1="128" y1="90" x2="121" y2="78"/>
    <line x1="128" y1="95" x2="119" y2="86"/>
    <line x1="128" y1="100" x2="118" y2="93"/>
    <line x1="128" y1="90" x2="135" y2="78"/>
    <line x1="128" y1="95" x2="137" y2="86"/>
    <line x1="128" y1="100" x2="138" y2="93"/>
  </g>

  <!-- Bar chart (prediction/data) -->
  <g fill="rgba(255,255,255,0.9)">
    <rect x="58" y="118" width="10" height="22" rx="2"/>
    <rect x="72" y="110" width="10" height="30" rx="2"/>
    <rect x="86" y="104" width="10" height="36" rx="2"/>
  </g>

  <!-- Upward trend arrow -->
  <polyline points="58,130 72,120 86,112 102,105 118,98"
    fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="118,98 112,104 122,106" fill="#fcd34d"/>

  <!-- Ground line -->
  <line x1="50" y1="142" x2="150" y2="142" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Text: BUGESERA -->
  <text x="100" y="162" text-anchor="middle" font-family="Arial,sans-serif"
    font-size="13" font-weight="900" fill="white" letter-spacing="2">BUGESERA</text>

  <!-- Text: HARVEST PREDICTION -->
  <text x="100" y="176" text-anchor="middle" font-family="Arial,sans-serif"
    font-size="7.5" font-weight="600" fill="rgba(255,255,255,0.75)" letter-spacing="1">HARVEST PREDICTION</text>
</svg>